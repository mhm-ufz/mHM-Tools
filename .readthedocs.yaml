version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # hatch-vcs needs the git tags to work out the version
    post_checkout:
      - git fetch --unshallow || true

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc
